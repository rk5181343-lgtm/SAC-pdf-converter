name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # OCR is optional at runtime and heavy to install, so it is left out of CI.
        run: |
          python -m pip install --upgrade pip
          pip install "Flask>=3.0,<4.0" "python-dotenv>=1.0,<2.0" "pdfplumber>=0.11,<1.0" \
            "pypdfium2>=4.28,<5.0" "pypdf>=4.2,<6.0" "Pillow>=10.3,<12.0" \
            "openpyxl>=3.1,<4.0" "reportlab>=4.1,<5.0" "python-docx>=1.1,<2.0" \
            "python-pptx>=0.6.23,<2.0" "pytest>=8.0,<9.0"

      - name: Run tests
        run: python -m pytest -q
